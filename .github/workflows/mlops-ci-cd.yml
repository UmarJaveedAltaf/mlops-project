name: MLOps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add --name ml --yes

      - name: Submit Azure ML training job
        id: train
        run: |
          JOB_NAME=$(az ml job create \
            --file pipelines/train-pipeline.yml \
            --resource-group mlops-rg \
            --workspace-name mlops-ws \
            --set display_name=ci-run-${{ github.sha }} \
            --query name \
            --output tsv)

          echo "JOB_NAME=$JOB_NAME" >> "$GITHUB_ENV"
          echo "Submitted Azure ML job: $JOB_NAME"

      - name: Wait for training to complete
        run: |
          az ml job stream \
            --name "$JOB_NAME" \
            --resource-group mlops-rg \
            --workspace-name mlops-ws

      - name: Register trained model
        run: |
          MODEL_VERSION="${{ github.run_id }}"

          az ml model create \
            --name diabetes-model \
            --version "$MODEL_VERSION" \
            --path "azureml://jobs/$JOB_NAME/outputs/model_output/paths/" \
            --type custom_model \
            --resource-group mlops-rg \
            --workspace-name mlops-ws

          echo "MODEL_VERSION=$MODEL_VERSION" >> "$GITHUB_ENV"
          echo "Registered diabetes-model:$MODEL_VERSION"

      - name: Update deployment model version
        run: |
          sed -i \
            "s|model: azureml:diabetes-model:.*|model: azureml:diabetes-model:$MODEL_VERSION|" \
            deploy/deployment.yml

          echo "Deployment will use diabetes-model:$MODEL_VERSION"
          cat deploy/deployment.yml

      - name: Create or update deployment
        run: |
          if az ml online-deployment show \
            --name blue \
            --endpoint-name diabetes-mlops-umar \
            --resource-group mlops-rg \
            --workspace-name mlops-ws \
            > /dev/null 2>&1; then

            echo "Deployment exists. Updating blue deployment..."

            az ml online-deployment update \
              --file deploy/deployment.yml \
              --resource-group mlops-rg \
              --workspace-name mlops-ws

          else

            echo "Deployment does not exist. Creating blue deployment..."

            az ml online-deployment create \
              --file deploy/deployment.yml \
              --resource-group mlops-rg \
              --workspace-name mlops-ws \
              --all-traffic

          fi

      - name: Verify deployment
        run: |
          az ml online-deployment show \
            --name blue \
            --endpoint-name diabetes-mlops-umar \
            --resource-group mlops-rg \
            --workspace-name mlops-ws \
            --query "{Name:name,ProvisioningState:provisioning_state}" \
            --output table